name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 用于 Trusted Publishing（OIDC）

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 采用 Trusted Publishing（OIDC）认证，无需管理 token。
          # 需在 PyPI 项目设置里将本 GitHub 仓库配置为 Trusted Publisher：
          #   https://pypi.org/manage/project/<project>/settings/publishing/
          # 配置时选择 GitHub，仓库填 xarkeo/Xflow，工作流填 publish.yml。
          skip-existing: true
