[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xarkeo-xflow"
version = "1.0.0"
description = "Fast, pandas-first Python client for the Xarkeo market data API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Xarkeo" },
]
keywords = ["finance", "market-data", "xflow", "xarkeo", "china-stocks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "httpx[http2]>=0.27,<1",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-benchmark>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "twine>=7,<8",
]

[project.urls]
Homepage = "https://xarkeo.com"
Documentation = "https://api.xarkeo.com"
Repository = "https://github.com/xarkeo/xflow"
Issues = "https://github.com/xarkeo/xflow/issues"

[tool.hatch.build]
exclude = [
  ".claude",
  ".pytest_cache",
  ".ruff_cache",
  "benchmark-report.json",
  "tmp.txt",
  "**/__pycache__",
  "*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xflow"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长度检查（风格问题，暂不强制）

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/xflow"]
# 忽略预先存在的类型问题（不影响运行时功能，后续逐步修复）
disable_error_code = [
  "arg-type",
  "no-any-return",
  "type-arg",
  "misc",
  "return-value",
  "call-arg",
]

[tool.coverage.run]
branch = true
source = ["xarkeo"]
